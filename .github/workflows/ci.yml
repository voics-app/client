name: ci
on:
  push:
    branches: [main, develop, "release/**"]
  schedule:
    - cron: "17 4 * * 1" # weekly cold build (CI_CACHE off): proves the persistent CI cache hides nothing (ADR 0022)
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitflow:
    if: github.event_name == 'pull_request'
    uses: discordy-voics/.github/.github/workflows/gitflow-guard.yml@main

  node:
    permissions:
      contents: read
      actions: read   # shared workflow: tag builds look up the main run of this commit
      packages: read  # private npm packages (GitHub Packages)
    uses: discordy-voics/.github/.github/workflows/node.yml@main
    with:
      image-name: discordy-client
      lint-script: lint
      typecheck-script: typecheck
      test-script: "test:ci"
  boot-reference:
    # Run the signed-out Electron path on the existing Linux runner, using fresh profiles.
    if: github.event_name == 'pull_request'
    runs-on: vm-runner
    continue-on-error: true
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
      - name: Check reference environment
        run: |
          uname -a
          command -v xvfb-run
          node --version
          pnpm --version
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build renderer
        run: pnpm --filter @discordy/desktop exec electron-vite build
      - name: Measure three fresh Electron launches
        working-directory: apps/desktop
        run: xvfb-run -a pnpm exec playwright test tests/e2e/smoke.spec.ts --grep 'signs in and lands' --repeat-each=3 --workers=1

  docker:
    needs: [node]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: discordy-voics/.github/.github/workflows/docker.yml@main
    with:
      image-name: client
      description: Voics client web build (renderer bundle and component gallery, served by nginx)
