name: Temporary voice Android QA
on:
  workflow_dispatch:
  push:
    branches: [feature/voice-messages-15]
permissions:
  contents: read
jobs:
  probe:
    if: ${{ contains(github.event.head_commit.message, '[probe-only]') }}
    runs-on: vm-runner
    steps:
      - name: Inspect existing tools without changing host
        run: |
          command -v java || true
          java -version || true
          command -v node || true
          node --version || true
          command -v pnpm || true
          command -v ffmpeg || true
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$ANDROID_HOME" "$ANDROID_SDK_ROOT"
          for dir in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" "$HOME/Android/Sdk" /opt/android-sdk /usr/local/lib/android/sdk; do
            if [ -n "$dir" ] && [ -d "$dir" ]; then printf 'SDK candidate: %s\n' "$dir"; ls "$dir"; fi
          done
          docker images --format '{{.Repository}}:{{.Tag}}' || true
  remux:
    if: ${{ contains(github.event.head_commit.message, '[remux-only]') }}
    runs-on: vm-runner
    steps:
      - uses: actions/checkout@v4
      - run: node --version && pnpm --version
      - run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/voice-pnpm-store"
      - run: ffmpeg -version && ffprobe -version
      - run: node apps/desktop/tests/voice-remux.mjs
  apk:
    if: ${{ contains(github.event.head_commit.message, '[voice-apk]') }}
    runs-on: vm-runner
    timeout-minutes: 60
    env:
      VOICS_MOBILE_QA: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --frozen-lockfile
      - run: echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'cmake;3.31.6'
      - run: pnpm exec expo prebuild --platform android --no-install
        working-directory: apps/mobile
      - run: sed -i '/^react {/a\    debuggableVariants = []' app/build.gradle
        working-directory: apps/mobile/android
      - run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=x86_64 -Pandroid.cmakeVersion=3.31.6
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: voics-voice-qa-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 2
