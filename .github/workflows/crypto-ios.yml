# Builds the iOS package of the crypto engine (XCFramework + Swift binding) on a macOS runner.
# On demand only. Requires a dedicated macOS VM runner with Xcode and iOS SDKs, labelled
# voics-macos-xcode. No hosted fallback is permitted. Start it from the Actions tab or with
#   gh workflow run crypto-ios.yml --ref <branch>
# The EAS build downloads the artifact `voics-crypto-ios` (apps/mobile/scripts/fetch-crypto-framework.mjs).
name: crypto-ios

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-ios
  cancel-in-progress: true

jobs:
  xcframework:
    name: Build the XCFramework
    runs-on: [self-hosted, macOS, ARM64, voics-macos-xcode]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/crypto/target
          key: crypto-ios-${{ hashFiles('native/crypto/Cargo.lock') }}
          restore-keys: crypto-ios-
      - name: Build
        run: native/crypto/ios/build-xcframework.sh "$RUNNER_TEMP/ios-package"
      - uses: actions/upload-artifact@v4
        with:
          name: voics-crypto-ios
          path: ${{ runner.temp }}/ios-package
          if-no-files-found: error
          retention-days: 90
