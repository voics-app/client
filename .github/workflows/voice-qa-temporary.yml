name: Temporary voice Android QA
on:
  workflow_dispatch:
  push:
    branches: [feature/voice-messages-15]
permissions:
  contents: read
jobs:
  probe:
    if: ${{ contains(github.event.head_commit.message, '[probe-only]') }}
    runs-on: vm-runner
    steps:
      - name: Inspect existing tools without changing host
        run: |
          command -v java || true
          java -version || true
          command -v node || true
          node --version || true
          command -v pnpm || true
          command -v ffmpeg || true
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$ANDROID_HOME" "$ANDROID_SDK_ROOT"
          for dir in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" "$HOME/Android/Sdk" /opt/android-sdk /usr/local/lib/android/sdk; do
            if [ -n "$dir" ] && [ -d "$dir" ]; then printf 'SDK candidate: %s\n' "$dir"; ls "$dir"; fi
          done
          docker images --format '{{.Repository}}:{{.Tag}}' || true
  remux:
    if: ${{ !contains(github.event.head_commit.message, '[probe-only]') }}
    runs-on: vm-runner
    steps:
      - uses: actions/checkout@v4
      - run: node --version && pnpm --version
      - run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/voice-pnpm-store"
      - run: ffmpeg -version && ffprobe -version
      - run: node apps/desktop/tests/voice-remux.mjs
  apk:
    if: ${{ contains(github.event.head_commit.message, '[voice-apk]') }}
    runs-on: vm-runner
    timeout-minutes: 60
    env:
      VOICS_MOBILE_QA: '1'
      GRADLE_USER_HOME: ${{ runner.temp }}/voice-gradle
    steps:
      - uses: actions/checkout@v4
      - run: node --version && pnpm --version && java -version
      - run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/voice-pnpm-store"
      - name: Remove development launcher from this QA checkout
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'apps/mobile/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          delete pkg.dependencies['expo-dev-client'];
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          const config = 'apps/mobile/app.config.ts';
          const before = fs.readFileSync(config, 'utf8');
          const after = before.replace("    'expo-dev-client',\n", '');
          if (after === before) throw new Error('Development client plugin not found');
          fs.writeFileSync(config, after);
          NODE
      - run: pnpm exec expo prebuild --platform android --no-install
        working-directory: apps/mobile
      - name: Verify QA identity and debug signing
        run: |
          grep -q 'applicationId "nl.voics.app.qa"' app/build.gradle
          grep -A 12 'release {' app/build.gradle | grep -q 'signingConfig signingConfigs.debug'
        working-directory: apps/mobile/android
      - run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 -Pandroid.cmakeVersion=3.31.6
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: voics-voice-qa-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 2
