[package]
name = "discordy-crypto"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openmls = "0.9"
openmls_rust_crypto = "0.6"
openmls_basic_credential = "0.6"
openmls_traits = "0.6"
openmls_memory_storage = "0.6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.37", features = ["bundled"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
napi = { version = "3", default-features = false, features = ["napi6"], optional = true }
napi-derive = { version = "3", optional = true }
uniffi = { version = "0.32", optional = true }

[build-dependencies]
napi-build = { version = "2", optional = true }

[features]
default = ["napi"]
napi = ["dep:napi", "dep:napi-derive", "dep:napi-build"]
uniffi = ["dep:uniffi"]
# Only for generating the Swift binding (ios/build-xcframework.sh); never part of the desktop build.
uniffi-cli = ["uniffi", "uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi-cli"]
