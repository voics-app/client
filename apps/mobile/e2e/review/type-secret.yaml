# Types ${SECRET} one character at a time. A secure text field of the app drops text that arrives in one burst (React Native's controlled
# secureTextEntry on iOS), which is how a person types it anyway.
appId: nl.voics.app
---
- evalScript: ${output.chars = SECRET.split(''); output.at = 0}
- repeat:
    while:
      true: ${output.at < output.chars.length}
    commands:
      - inputText: ${output.chars[output.at]}
      - evalScript: ${output.at = output.at + 1}
