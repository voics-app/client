# Fetches an Android APK, built on EAS with the `apk` profile (apps/mobile/eas.json), for the update
# feed (https://updates.voics.nl; published by gitops publish-public) as Voics-<version>.apk and Voics-latest.apk, which is where the website's
# "Download for Android" button points, and attaches it to the GitHub Release android-v<version>.
#
# Run by hand after `npx eas-cli build -p android --profile apk` finished:
#   gh workflow run android-apk.yml -f apk_url=<EAS artifact URL> -f version=1.0.0
name: android-apk

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "EAS artifact URL of the finished APK build (https://expo.dev/artifacts/eas/....apk)."
        type: string
        required: true
      version:
        description: "App version, e.g. 1.0.0 (apps/mobile app.config.ts)."
        type: string
        required: true

permissions:
  contents: write

jobs:
  fetch:
    name: Fetch the APK from EAS
    runs-on: ubuntu-latest
    steps:
      - name: Download and check
        env:
          APK_URL: ${{ inputs.apk_url }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$APK_URL" == https://expo.dev/artifacts/eas/* ]] || { echo "::error::apk_url must be an expo.dev EAS artifact"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must look like 1.0.0"; exit 1; }
          mkdir -p out
          curl -fsSL "$APK_URL" -o "out/Voics-${VERSION}.apk"
          # An APK is a zip that starts with PK and holds AndroidManifest.xml.
          unzip -l "out/Voics-${VERSION}.apk" | grep -q AndroidManifest.xml || { echo "::error::not an APK"; exit 1; }
          # The stable download name is a real file in the artifact: minio-publish applies short-cache to artifact
          # files only, before its copies step runs.
          cp "out/Voics-${VERSION}.apk" out/Voics-latest.apk
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out
          retention-days: 14
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="android-v${VERSION}"
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Voics for Android ${VERSION}" --notes "Android APK. Install: open the file on the phone and allow installing from this source."
          gh release upload "$tag" "out/Voics-${VERSION}.apk" -R "$GITHUB_REPOSITORY" --clobber

  # Publishing to the update feed happens in the private gitops repo (workflow publish-public, source
  # client-android): this repo is public and the in-cluster runner that reaches MinIO does not take jobs from public
  # repositories. It picks up the android-apk artifact of this run within 10 minutes.
