name: ci
on:
  push:
    branches: [main, develop, "release/**"]
  schedule:
    - cron: "17 4 * * 1" # weekly cold build (CI_CACHE off): proves the persistent CI cache hides nothing (ADR 0022)
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    uses: discordy-voics/.github/.github/workflows/node.yml@main
    with:
      image-name: discordy-client
      lint-script: lint
      typecheck-script: typecheck
      test-script: "test:unit"
  docker:
    needs: [node]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: discordy-voics/.github/.github/workflows/docker.yml@main
    with:
      image-name: client
      description: Discordy client web build (renderer bundle and component gallery, served by nginx)
