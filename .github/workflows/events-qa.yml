name: Scheduled event desktop draft QA
on:
  push:
    branches: [feature/client-scheduled-events]
permissions:
  contents: read
jobs:
  desktop-fixture:
    runs-on: vm-runner
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @discordy/crypto build
      - name: Desktop event user flow against loopback fixture
        run: xvfb-run -a pnpm --filter @discordy/desktop test:e2e
