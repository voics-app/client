name: Temporary standalone voice QA
on: workflow_dispatch
permissions:
  contents: read
jobs:
  apk:
    runs-on: vm-runner
    timeout-minutes: 60
    env:
      VOICS_MOBILE_QA: '1'
      GRADLE_USER_HOME: ${{ runner.temp }}/voice-gradle
    steps:
      - uses: actions/checkout@v4
      - name: Verify existing toolchain
        run: |
          node --version
          pnpm --version
          java -version
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME/cmake/3.31.6"
      - run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/voice-pnpm-store"
      - name: Disable development launcher in this QA checkout
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'apps/mobile/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          delete pkg.dependencies['expo-dev-client'];
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          const config = 'apps/mobile/app.config.ts';
          const before = fs.readFileSync(config, 'utf8');
          const after = before.replace("    'expo-dev-client',\n", '');
          if (after === before) throw new Error('Development client plugin not found');
          fs.writeFileSync(config, after);
          NODE
      - run: pnpm exec expo prebuild --platform android --no-install
        working-directory: apps/mobile
      - name: Verify QA identity and debug signing
        working-directory: apps/mobile/android
        run: |
          grep -q 'applicationId "nl.voics.app.qa"' app/build.gradle
          grep -A 12 'release {' app/build.gradle | grep -q 'signingConfig signingConfigs.debug'
      - run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 -Pandroid.cmakeVersion=3.31.6
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: voics-voice-standalone-qa-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 2
