name: Android artifact collection test
on:
  pull_request:
    paths:
      - '.github/workflows/android-apk.yml'
      - '.github/workflows/android-apk-test.yml'
      - 'scripts/collect-android-apk.sh'
      - 'scripts/test-collect-android-apk.sh'
permissions:
  contents: read
concurrency:
  group: android-artifact-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  isolation:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: vm-runner
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/test-collect-android-apk.sh
  windows-routing:
    # Match the production release selector without installing or modifying anything.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.WINDOWS_RUNNER == 'karma-win' && 'karma-win' || 'voics-windows-vm' }}
    steps:
      - name: Verify native Windows runner
        shell: powershell
        run: |
          if ($env:RUNNER_OS -ne 'Windows') { throw 'Expected a native Windows runner' }
          Write-Host "Runner: $env:RUNNER_NAME; OS: $env:RUNNER_OS; Version: $([Environment]::OSVersion.VersionString)"
          $gitBin = Join-Path $env:ProgramFiles 'Git\bin'
          if (-not (Test-Path (Join-Path $gitBin 'bash.exe'))) { throw 'Git for Windows Bash is required' }
          [System.IO.File]::AppendAllText($env:GITHUB_PATH, "$gitBin`n", [System.Text.UTF8Encoding]::new($false))
      - name: Verify release Bash
        shell: bash
        timeout-minutes: 2
        run: |
          command -v bash
          case "$(uname -s)" in MINGW*|MSYS*) ;; *) echo 'Git for Windows Bash is required'; exit 1 ;; esac
          node --version
          rustc --version
          cargo --version
