# Publishes an Android APK, built on EAS with the `apk` profile (apps/mobile/eas.json), to the update
# feed (https://updates.voics.nl) as Voics-<version>.apk and Voics-latest.apk, which is where the website's
# "Download for Android" button points, and attaches it to the GitHub Release android-v<version>.
#
# Run by hand after `npx eas-cli build -p android --profile apk` finished:
#   gh workflow run android-apk.yml -f apk_url=<EAS artifact URL> -f version=1.0.0
name: android-apk

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "EAS artifact URL of the finished APK build (https://expo.dev/artifacts/eas/....apk)."
        type: string
        required: true
      version:
        description: "App version, e.g. 1.0.0 (apps/mobile app.config.ts)."
        type: string
        required: true

permissions:
  contents: write

jobs:
  fetch:
    name: Fetch the APK from EAS
    runs-on: vm-runner
    steps:
      - uses: actions/checkout@v5
      - name: Select a fresh output directory
        run: echo "OUT_DIR=$RUNNER_TEMP/android-apk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Verify isolated artifact collection
        run: bash scripts/test-collect-android-apk.sh
      - name: Download and check
        env:
          APK_URL: ${{ inputs.apk_url }}
          VERSION: ${{ inputs.version }}
        run: bash scripts/collect-android-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.OUT_DIR }}/*.apk
          retention-days: 14
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="android-v${VERSION}"
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Voics for Android ${VERSION}" --notes "Android APK. Install: open the file on the phone and allow installing from this source."
          gh release upload "$tag" "$OUT_DIR/Voics-${VERSION}.apk" -R "$GITHUB_REPOSITORY" --clobber

  publish:
    name: Publish to the update feed
    needs: [fetch]
    uses: discordy-voics/.github/.github/workflows/minio-publish.yml@main
    with:
      artifact: android-apk
      bucket: discordy-updates
      short-cache: Voics-latest.apk
