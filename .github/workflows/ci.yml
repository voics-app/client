name: ci
on:
  push:
    branches: [main, develop, "feature/**", "release/**"]
  pull_request:

jobs:
  node:
    uses: discordy-voics/.github/.github/workflows/node.yml@main
    with:
      image-name: discordy-client
      lint-script: lint
      typecheck-script: typecheck
      test-script: "test:unit"
  docker:
    needs: [node]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: discordy-voics/.github/.github/workflows/docker.yml@main
    with:
      image-name: client
      description: Discordy client web build (renderer bundle and component gallery, served by nginx)
