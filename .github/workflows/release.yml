# Builds the desktop installer and publishes it to the update feed
# (https://updates.voics.nl), which is also where the website's Download button points.
#
#   push to main (= a git-flow release)  -> publish; merge of release/X.Y.Z or hotfix/X.Y.Z = exactly X.Y.Z,
#                                           otherwise package.json when newer than the feed, else feed patch + 1
#                                           (scripts/release-version.mjs); then tags vX.Y.Z
#   push of a v* tag                     -> publish exactly that version (must be newer than the feed); a no-op
#                                           when the feed already serves it (scripts/release.sh tags after the
#                                           release merge, which already published it: client#194)
#   workflow_dispatch                    -> same as a push of the selected branch (use main)
#
# Output: GitHub Release assets and the installer-windows artifact, which gitops publish-public puts in the discordy-updates bucket as Voics-Setup-X.Y.Z.exe(.blockmap),
# latest.yml and the stable Voics-Setup-latest.exe (5-minute cache). electron-updater in installed
# clients reads latest.yml, so publishing it is what rolls the update out.
# The linux job builds the same version as AppImage and deb (artifact installer-linux, latest-linux.yml for AppImage
# auto-update); the private gitops workflow publish-public (source client-linux) puts them in the bucket as
# Voics-X.Y.Z.AppImage/.deb plus the stable Voics-latest.AppImage and Voics-latest.deb.
# develop never publishes: Windows minutes cost 2x and a beta channel is not needed yet.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: client-release
  cancel-in-progress: false

env:
  FEED: https://updates.voics.nl

jobs:
  windows:
    name: Build Windows installer
    # Owner PC runner (label karma-win, .github/scripts/runner-win.ps1) when the repo variable is set; GitHub-hosted otherwise.
    runs-on: ${{ vars.WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Not on tag runs: those are usually a no-op (the release merge already published), and with no
          # pnpm install the cache save fails the run on a missing path.
          cache: ${{ github.ref_type != 'tag' && 'pnpm' || '' }}
      - name: Decide the version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          # Cache-bust: Cloudflare caches latest.yml for 5 minutes and a stale copy would repeat a version.
          code="$(curl -sS -o latest-feed.yml -w '%{http_code}' "${FEED}/latest.yml?ts=$(date +%s)")"
          case "$code" in
            200) published="$(node scripts/release-version.mjs --latest-yml latest-feed.yml --print-published)" ;;
            404) published="none" ;;
            *) echo "::error::cannot read the feed (HTTP ${code}); refusing to guess the published version"; exit 1 ;;
          esac
          echo "feed currently serves: ${published}"
          tag=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            # A git-flow release merge publishes the release branch's version, not package.json + 1 (client#194).
            subject="$(git log -1 --format=%s)"
            if [[ "$subject" =~ from\ [^/]+/(release|hotfix)/v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then tag="v${BASH_REMATCH[2]}"; fi
          fi
          if [ -n "$tag" ] && [ "${tag#v}" = "${published}" ]; then
            echo "${tag} is already on the feed (published by the release merge); nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(node scripts/release-version.mjs --published "${published}" ${tag:+--tag "$tag"} --apply)"
          echo "publishing version: ${version}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.ver.outputs.skip != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.ver.outputs.skip != 'true'
        with:
          workspaces: native/crypto
      - name: Install dependencies
        if: steps.ver.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - name: Build installer
        if: steps.ver.outputs.skip != 'true'
        run: pnpm dist:win
      - name: Collect installer and update feed
        if: steps.ver.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp apps/desktop/release/*.exe apps/desktop/release/*.exe.blockmap apps/desktop/release/latest.yml out/
          ls -la out
          test -f "out/Voics-Setup-${VERSION}.exe" || { echo "::error::installer name does not match version ${VERSION}"; exit 1; }
          grep -q "^version: ${VERSION}$" out/latest.yml || { echo "::error::latest.yml does not carry ${VERSION}"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          name: installer-windows
          path: out
          retention-days: 14
      - name: Tag and attach to the GitHub Release
        if: steps.ver.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          # Releases for main merges are tagged here (tags pushed with GITHUB_TOKEN do not re-trigger workflows).
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_SHA" --title "Voics ${VERSION}" --notes "See CHANGELOG.md."
          gh release upload "$tag" out/* --clobber
    outputs:
      version: ${{ steps.ver.outputs.version }}
      skip: ${{ steps.ver.outputs.skip }}

  linux:
    name: Build Linux packages
    # Same version as the Windows job (decided there); AppImage and deb, x64, with the native crypto module (Rust).
    needs: [windows]
    if: needs.windows.outputs.skip != 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.windows.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/crypto
      - name: Apply the version
        run: cd apps/desktop && npm pkg set "version=${VERSION}"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build AppImage and deb
        run: pnpm dist:linux
      - name: Collect packages and update feed
        run: |
          set -euo pipefail
          mkdir -p out
          cp apps/desktop/release/*.AppImage apps/desktop/release/*.deb apps/desktop/release/latest-linux.yml out/
          ls -la out
          test -f "out/Voics-${VERSION}.AppImage" || { echo "::error::AppImage name does not match version ${VERSION}"; exit 1; }
          test -f "out/Voics-${VERSION}.deb" || { echo "::error::deb name does not match version ${VERSION}"; exit 1; }
          grep -q "^version: ${VERSION}$" out/latest-linux.yml || { echo "::error::latest-linux.yml does not carry ${VERSION}"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: out
          retention-days: 14
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_SHA" --title "Voics ${VERSION}" --notes "See CHANGELOG.md."
          gh release upload "$tag" out/* --clobber

  # Publishing to the update feed happens in the private gitops repo (workflow publish-public): this repo is public
  # and the in-cluster runner that reaches MinIO does not take jobs from public repositories. It picks up the
  # installer-windows artifact of the newest successful run within 10 minutes, uploads latest.yml with a short
  # cache and copies Voics-Setup-X.Y.Z.exe to Voics-Setup-latest.exe.
