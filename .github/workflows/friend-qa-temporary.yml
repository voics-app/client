name: Temporary friend invite Android QA
on:
  workflow_dispatch:
  push:
    branches: [qa/api-103-android]
permissions:
  contents: read
jobs:
  apk:
    runs-on: vm-runner
    timeout-minutes: 60
    env:
      VOICS_MOBILE_QA: '1'
      VOICS_QA_API_URL: 'http://10.0.2.2:28135'
      VOICS_QA_GATEWAY_URL: 'ws://10.0.2.2:28135/gateway'
      VOICS_QA_CDN_URL: 'http://10.0.2.2:28135/cdn'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare job-local Node and pnpm
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/api103-node"
          curl -fsSL https://nodejs.org/dist/v24.11.1/node-v24.11.1-linux-x64.tar.xz -o "$RUNNER_TEMP/api103-node.tar.xz"
          tar -xJf "$RUNNER_TEMP/api103-node.tar.xz" --strip-components=1 -C "$RUNNER_TEMP/api103-node"
          export PATH="$RUNNER_TEMP/api103-node/bin:$PATH" COREPACK_HOME="$RUNNER_TEMP/api103-corepack"
          corepack enable
          echo "$RUNNER_TEMP/api103-node/bin" >> "$GITHUB_PATH"
          echo "COREPACK_HOME=$RUNNER_TEMP/api103-corepack" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/api103-gradle" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/api103-android-user" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/api103-pnpm-store"
      - name: Inspect Android tooling
        run: |
          java -version || true
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          command -v sdkmanager || true
          df -h "$RUNNER_TEMP"
      - name: Prepare job-local JDK if needed
        run: |
          set -euo pipefail
          if command -v java >/dev/null && java -version 2>&1 | grep -q 'version "17'; then exit 0; fi
          mkdir -p "$RUNNER_TEMP/api103-jdk"
          curl -fsSL https://api.adoptium.net/v3/binary/latest/17/ga/linux/x64/jdk/hotspot/normal/eclipse -o "$RUNNER_TEMP/api103-jdk.tar.gz"
          tar -xzf "$RUNNER_TEMP/api103-jdk.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/api103-jdk"
          echo "JAVA_HOME=$RUNNER_TEMP/api103-jdk" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/api103-jdk/bin" >> "$GITHUB_PATH"
      - name: Prepare job-local Android SDK
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/api103-android-sdk"
          mkdir -p "$sdk/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/api103-commandlinetools.zip"
          unzip -q "$RUNNER_TEMP/api103-commandlinetools.zip" -d "$sdk/cmdline-tools"
          mv "$sdk/cmdline-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
          export ANDROID_HOME="$sdk" ANDROID_SDK_ROOT="$sdk"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'cmake;3.31.6'
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
      - name: Remove development launcher in isolated QA checkout
        run: |
          node -e "const fs=require('fs'); const p='apps/mobile/package.json'; const j=JSON.parse(fs.readFileSync(p)); delete j.dependencies['expo-dev-client']; fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n');"
          sed -i "/^[[:space:]]*'expo-dev-client',/d" apps/mobile/app.config.ts
      - run: pnpm exec expo prebuild --platform android --no-install
        working-directory: apps/mobile
      - run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 -Pandroid.cmakeVersion=3.31.6
        working-directory: apps/mobile/android
      - name: Verify QA package and debug signing
        run: |
          set -euo pipefail
          apk=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | head -1 | grep "package: name='nl.voics.app.qa'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/api103-signer.txt"
          grep -F 'Signer #1 certificate DN: CN=Android Debug' "$RUNNER_TEMP/api103-signer.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: voics-api103-qa-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 2
